<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triangle Mapper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0c0c12;
      color: #e0e0f0;
      min-height: 100vh;
      padding: 20px 20px 48px;
    }

    /* ── Header ─────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1200px;
      margin: 0 auto 22px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-title h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #c8c8e8;
      transition: color 0.3s;
    }

    .header-title p {
      font-size: 0.67rem;
      color: #444;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 2px;
      transition: color 0.3s;
    }

    .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .mode-toggle {
      display: flex;
      background: #14141e;
      border: 1px solid #222232;
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .mode-btn {
      background: none;
      border: none;
      color: #444;
      font-family: inherit;
      font-size: 0.73rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
    }
    .mode-btn.active { background: #22224a; color: #b8b8ff; }
    .mode-btn:not(.active):hover { color: #888; }

    .btn-export {
      background: #0e1e16;
      border: 1px solid #1a3024;
      color: #60e8a0;
      font-family: inherit;
      font-size: 0.73rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }
    .btn-export:hover { background: #142818; }

    /* ── Layout ─────────────────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 322px;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── Triangle ───────────────────────────────────────── */
    .tri-section { display: flex; flex-direction: column; gap: 14px; }

    .tri-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 0.9;
      user-select: none;
      -webkit-user-select: none;
    }

    .tri-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Corner labels */
    .corner {
      position: absolute;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .corner-top { top: 0; left: 50%; transform: translateX(-50%); }
    .corner-br  { bottom: 1%; right: 0; align-items: flex-end; }
    .corner-bl  { bottom: 1%; left: 0; align-items: flex-start; }

    .corner-pill {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 4px;
      white-space: nowrap;
      transition: background 0.35s, color 0.35s, border-color 0.35s;
    }
    .corner-sub {
      font-size: 0.57rem;
      color: #3a3a5a;
      text-align: center;
      max-width: 100px;
      line-height: 1.3;
    }

    /* Chips */
    .chip {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px 4px 7px;
      border-radius: 20px;
      font-size: 0.69rem;
      font-weight: 600;
      cursor: grab;
      touch-action: none;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: box-shadow 0.15s, border-color 0.15s;
      z-index: 10;
      max-width: 160px;
    }
    .chip:active { cursor: grabbing; z-index: 20; }
    .chip.selected {
      box-shadow: 0 0 0 2px rgba(180,180,255,0.35);
      border-color: rgba(180,180,255,0.25) !important;
    }
    .chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .chip-name { overflow: hidden; text-overflow: ellipsis; }

    /* Situation */
    .sit-card {
      background: #12121a;
      border: 1px solid #1e1e2e;
      border-radius: 10px;
      padding: 14px;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    .sidebar { display: flex; flex-direction: column; gap: 11px; }

    .card {
      background: #12121a;
      border: 1px solid #1e1e2e;
      border-radius: 10px;
      padding: 14px;
    }

    .card-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #484868;
      margin-bottom: 9px;
    }

    textarea, input[type="text"], input[type="password"], select {
      font-family: inherit;
      font-size: 0.79rem;
      background: #0c0c12;
      border: 1px solid #1e1e2e;
      border-radius: 6px;
      color: #cccce8;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus, input:focus { border-color: #38387a; }
    textarea::placeholder, input::placeholder { color: #2e2e4a; }

    textarea {
      width: 100%;
      line-height: 1.65;
      padding: 8px 10px;
      resize: vertical;
    }

    input[type="text"], input[type="password"] {
      flex: 1;
      min-width: 0;
      padding: 6px 9px;
    }

    select {
      padding: 6px 8px;
      cursor: pointer;
      min-width: 108px;
    }

    .form-row { display: flex; gap: 7px; margin-bottom: 7px; }
    .form-row:last-child { margin-bottom: 0; }

    .btn {
      background: #181828;
      border: 1px solid #2a2a4a;
      color: #8888c8;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: #202038; }
    .btn-primary { background: #1e1e42; border-color: #3a3a72; color: #a8a8ff; }
    .btn-primary:hover { background: #242452; }
    .btn-danger { color: #ff7a7a; }
    .btn-danger:hover { background: #281010; border-color: #421818; }
    .btn:disabled { opacity: 0.45; cursor: default; }

    /* People list */
    .people-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 170px;
      overflow-y: auto;
    }

    .person-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      background: #0c0c12;
      border: 1px solid #1e1e2e;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .person-row:hover { border-color: #383868; }
    .person-row.selected { border-color: #42427a; background: #0e0e28; }
    .person-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .role-badge {
      font-size: 0.59rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Commentary */
    #commentary-panel { display: none; }
    #commentary-panel.open { display: block; }

    .comm-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    /* Analysis */
    .analysis-out {
      background: #0c0c12;
      border: 1px solid #1e1e2e;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.76rem;
      line-height: 1.72;
      color: #9898c0;
      white-space: pre-wrap;
      max-height: 270px;
      overflow-y: auto;
      display: none;
    }
    .analysis-out.open { display: block; }

    .analyzing {
      font-size: 0.73rem;
      color: #444;
      padding: 6px 0 2px;
      display: none;
    }
    .analyzing.open { display: block; }

    /* Role info */
    .ri-item {
      padding: 9px 11px;
      border-radius: 6px;
      font-size: 0.74rem;
      line-height: 1.55;
      margin-bottom: 7px;
    }
    .ri-item:last-child { margin-bottom: 0; }
    .ri-item strong {
      display: block;
      font-size: 0.61rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .ri-item p { color: #686898; }

    /* Empty */
    .empty { color: #2a2a46; font-size: 0.72rem; text-align: center; padding: 12px; font-style: italic; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a46; border-radius: 2px; }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-title">
    <h1 id="hdr-title">Drama Triangle</h1>
    <p id="hdr-sub">Karpman (1968) · click to select · drag to reposition</p>
  </div>
  <div class="header-actions">
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-drama"       onclick="setMode('drama')">Drama</button>
      <button class="mode-btn"        id="btn-empowerment" onclick="setMode('empowerment')">Empowerment</button>
    </div>
    <button class="btn-export" onclick="exportPNG()">↓ Export PNG</button>
  </div>
</div>

<div class="layout">

  <!-- Triangle + Situation -->
  <div class="tri-section">
    <div class="tri-container" id="tri">
      <svg class="tri-svg" viewBox="0 0 500 450" xmlns="http://www.w3.org/2000/svg">
        <polygon points="250,18 490,438 10,438" fill="none" stroke="#1a1a28" stroke-width="1.5"/>
        <text id="el" x="146" y="246" fill="#1c1c2c" font-size="10" font-family="sans-serif" transform="rotate(-60,146,246)">Power ↔ Powerlessness</text>
        <text id="er" x="354" y="190" fill="#1c1c2c" font-size="10" font-family="sans-serif" transform="rotate(60,354,190)">Control ↔ Helplessness</text>
        <text id="eb" x="110"  y="449" fill="#1c1c2c" font-size="10" font-family="sans-serif">Rescuing ↔ Dependence</text>
      </svg>
      <div class="corner corner-top" id="c-top"></div>
      <div class="corner corner-br"  id="c-br"></div>
      <div class="corner corner-bl"  id="c-bl"></div>
    </div>

    <div class="sit-card">
      <div class="card-label">Situation</div>
      <textarea id="situation" rows="4" placeholder="What is happening? Who said what? What triggered this dynamic…"></textarea>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">

    <div class="card">
      <div class="card-label">Add Person</div>
      <div class="form-row">
        <input type="text" id="pname" placeholder="Name (e.g. Me, Alex…)" maxlength="24"/>
      </div>
      <div class="form-row">
        <select id="ppos"></select>
        <button class="btn btn-primary" style="flex:1" onclick="addPerson()">Add</button>
      </div>
    </div>

    <div class="card">
      <div class="card-label">People</div>
      <div class="people-list" id="plist"><p class="empty">No one added yet.</p></div>
    </div>

    <div class="card" id="commentary-panel">
      <div class="comm-hdr">
        <div class="card-label" style="margin:0">Notes — <span id="cname" style="color:#a0a0ff;text-transform:none;letter-spacing:normal;font-weight:600"></span></div>
        <button class="btn btn-danger" style="padding:2px 8px;font-size:0.67rem" onclick="removePerson()">Remove</button>
      </div>
      <textarea id="ctext" rows="3" placeholder="Notes about this person's role in this situation…"></textarea>
    </div>

    <div class="card">
      <div class="card-label">AI Analysis</div>
      <div class="form-row">
        <input type="password" id="apikey" placeholder="Anthropic API key (sk-ant-…)"/>
      </div>
      <button class="btn btn-primary" id="analyze-btn" style="width:100%;margin-bottom:6px" onclick="analyze()">Analyse Dynamics</button>
      <div class="analyzing" id="analyzing">Analysing…</div>
      <div class="analysis-out" id="analysis-out"></div>
    </div>

    <div class="card" id="ri-card"></div>

  </div>
</div>

<script>
// ── Config ───────────────────────────────────────────────────────────────────
const MODES = {
  drama: {
    title: 'Drama Triangle', sub: 'Karpman (1968)',
    el: 'Power ↔ Powerlessness', er: 'Control ↔ Helplessness', eb: 'Rescuing ↔ Dependence',
    top: { label:'Persecutor', color:'#ff6b6b', text:'#ff9090', bg:'#2a1010', border:'#481616',
           desc:'Blames, criticises, controls',
           info:'Acts from fear or shame. Sets rigid limits. Feels righteous. Often a Victim who reached a breaking point.' },
    br:  { label:'Victim',     color:'#6bb5ff', text:'#90c8ff', bg:'#101828', border:'#162e42',
           desc:'Feels helpless, oppressed',
           info:'Feels unable to make decisions without help. Denies own capacity. Seeks Rescuer validation.' },
    bl:  { label:'Rescuer',    color:'#6bffa8', text:'#90ffb8', bg:'#0e1e16', border:'#163628',
           desc:'Helps to feel needed',
           info:'Gets self-worth from being needed. Enables dependence. Feels guilty when not helping.' }
  },
  empowerment: {
    title: 'Empowerment Triangle', sub: 'David Emerald — The Empowerment Dynamic (TED)',
    el: 'Accountability ↔ Blame', er: 'Learning ↔ Judging', eb: 'Empowering ↔ Rescuing',
    top: { label:'Challenger', color:'#fbbf24', text:'#fcd34d', bg:'#1e1600', border:'#382800',
           desc:'Provokes growth & learning',
           info:'Calls forth the best in others through honest questions and high standards. Focused on development, not control.' },
    br:  { label:'Creator',   color:'#c084fc', text:'#d4a0ff', bg:'#160e28', border:'#2c1a46',
           desc:'Outcome-focused, takes responsibility',
           info:'Focuses on what is wanted rather than what isn\'t. Takes responsibility. Uses challenges as fuel for growth.' },
    bl:  { label:'Coach',     color:'#22d3ee', text:'#67e8f9', bg:'#06161e', border:'#0c2c3a',
           desc:'Asks questions, empowers others',
           info:'Asks questions instead of giving answers. Believes in others\' ability to find solutions. Supports without rescuing.' }
  }
};

// ── State ────────────────────────────────────────────────────────────────────
const S = { mode: 'drama', people: [], sel: null, analysis: '' };

const cfg = () => MODES[S.mode];
const byId = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const get = id => byId(id);

// ── Mode ─────────────────────────────────────────────────────────────────────
function setMode(m) {
  S.mode = m;
  byId('btn-drama').classList.toggle('active', m==='drama');
  byId('btn-empowerment').classList.toggle('active', m==='empowerment');
  renderAll();
}

// ── People ───────────────────────────────────────────────────────────────────
function addPerson() {
  const nEl = byId('pname'), pEl = byId('ppos');
  const name = nEl.value.trim();
  if (!name) { nEl.focus(); return; }
  const pos = pEl.value;
  const base = {top:[47,8],br:[78,76],bl:[18,76]}[pos];
  S.people.push({
    id: Date.now(), name, pos, commentary: '',
    x: base[0] + (Math.random()*5-2.5),
    y: base[1] + (Math.random()*4-2)
  });
  nEl.value = '';
  nEl.focus();
  renderAll();
}

function removePerson() {
  if (!S.sel) return;
  S.people = S.people.filter(p => p.id !== S.sel);
  S.sel = null;
  renderAll();
}

function selectPerson(id) {
  S.sel = (S.sel === id) ? null : id;
  renderChips();
  renderPeople();
  renderComm();
}

// ── Drag ─────────────────────────────────────────────────────────────────────
let drag = null;

document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.ptId) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) drag.moved = true;
  if (!drag.moved) return;
  const r = byId('tri').getBoundingClientRect();
  const nx = Math.max(3, Math.min(95, drag.px + (dx/r.width)*100));
  const ny = Math.max(3, Math.min(90, drag.py + (dy/r.height)*100));
  const chip = byId('chip-'+drag.id);
  if (chip) { chip.style.left = nx+'%'; chip.style.top = ny+'%'; }
  const p = S.people.find(p => p.id===drag.id);
  if (p) { p.x = nx; p.y = ny; }
});

document.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.ptId) return;
  if (!drag.moved) selectPerson(drag.id);
  drag = null;
});

document.addEventListener('pointercancel', e => {
  if (drag && e.pointerId === drag.ptId) drag = null;
});

// ── Commentary sync ──────────────────────────────────────────────────────────
byId('ctext').addEventListener('input', e => {
  const p = S.people.find(p => p.id===S.sel);
  if (p) p.commentary = e.target.value;
});

// ── Render ───────────────────────────────────────────────────────────────────
function renderAll() {
  const c = cfg();
  byId('hdr-title').textContent = c.title;
  byId('hdr-sub').textContent = c.sub + ' · click to select · drag to reposition';
  byId('el').textContent = c.el;
  byId('er').textContent = c.er;
  byId('eb').textContent = c.eb;
  renderCorner('c-top', c.top);
  renderCorner('c-br',  c.br);
  renderCorner('c-bl',  c.bl);
  renderChips();
  renderPeople();
  renderComm();
  renderRoleInfo();
  renderAddForm();
}

function renderCorner(id, r) {
  byId(id).innerHTML = `
    <div class="corner-pill" style="background:${r.bg};color:${r.text};border:1px solid ${r.border}">${r.label}</div>
    <div class="corner-sub">${r.desc}</div>`;
}

function renderChips() {
  const cont = byId('tri');
  cont.querySelectorAll('.chip').forEach(c => c.remove());
  const c = cfg();
  S.people.forEach(person => {
    const r = c[person.pos];
    const chip = document.createElement('div');
    chip.className = 'chip' + (person.id===S.sel?' selected':'');
    chip.id = 'chip-'+person.id;
    chip.style.cssText = `left:${person.x}%;top:${person.y}%;background:${r.bg};color:${r.text};border-color:${r.border}`;
    chip.innerHTML = `<span class="chip-dot" style="background:${r.color}"></span><span class="chip-name">${esc(person.name)}</span>`;
    chip.addEventListener('pointerdown', e => {
      e.stopPropagation(); e.preventDefault();
      drag = { id:person.id, ptId:e.pointerId, sx:e.clientX, sy:e.clientY, px:person.x, py:person.y, moved:false };
      chip.setPointerCapture(e.pointerId);
    });
    cont.appendChild(chip);
  });
}

function renderPeople() {
  const list = byId('plist');
  if (!S.people.length) { list.innerHTML='<p class="empty">No one added yet.</p>'; return; }
  const c = cfg();
  list.innerHTML = S.people.map(p => {
    const r = c[p.pos];
    return `<div class="person-row${p.id===S.sel?' selected':''}" onclick="selectPerson(${p.id})">
      <span class="person-name">${esc(p.name)}</span>
      <span class="role-badge" style="background:${r.bg};color:${r.text};border:1px solid ${r.border}">${r.label}</span>
    </div>`;
  }).join('');
}

function renderComm() {
  const panel = byId('commentary-panel');
  const p = S.people.find(p => p.id===S.sel);
  if (!p) { panel.classList.remove('open'); return; }
  panel.classList.add('open');
  byId('cname').textContent = p.name;
  const ta = byId('ctext');
  if (ta !== document.activeElement) ta.value = p.commentary || '';
}

function renderRoleInfo() {
  const c = cfg();
  byId('ri-card').innerHTML = `<div class="card-label">${c.title} — Roles</div>` +
    ['top','br','bl'].map(k => {
      const r = c[k];
      return `<div class="ri-item" style="background:${r.bg};border-left:3px solid ${r.color}">
        <strong style="color:${r.text}">${r.label}</strong>
        <p>${r.info}</p>
      </div>`;
    }).join('');
}

function renderAddForm() {
  const c = cfg(), sel = byId('ppos'), prev = sel.value;
  sel.innerHTML = ['top','br','bl'].map(k=>`<option value="${k}">${c[k].label}</option>`).join('');
  if (['top','br','bl'].includes(prev)) sel.value = prev;
}

// ── Analysis ─────────────────────────────────────────────────────────────────
async function analyze() {
  const keyEl = byId('apikey');
  const apiKey = (keyEl.value.trim() || localStorage.getItem('tri_key') || '').trim();
  if (!apiKey) { keyEl.focus(); return; }
  localStorage.setItem('tri_key', apiKey);

  const c = cfg();
  const situation = byId('situation').value.trim();
  const people = S.people.map(p => {
    const r = c[p.pos];
    return `• ${p.name} — ${r.label}${p.commentary ? `\n  Notes: "${p.commentary}"` : ''}`;
  }).join('\n');

  const prompt = `You are helping someone reflect on an interpersonal situation using the ${c.title} framework.

Framework: ${c.title} (${c.sub})
${S.mode==='drama'
  ? 'The Drama Triangle describes dysfunctional relational patterns where people adopt reactive, stuck roles.'
  : 'The Empowerment Triangle (TED) describes healthier alternatives — Creator, Challenger, Coach — oriented toward growth and responsibility.'
}

SITUATION:
${situation || '(Not yet described)'}

PEOPLE & ROLES:
${people || '(None added)'}

Please provide a concise, insightful analysis (220–260 words) covering:
1. The core dynamic at play
2. How each person's role is sustaining the pattern
3. The key tension or stuck point
${S.mode==='drama'
  ? '4. How each person might shift toward their Empowerment counterpart:\n   Persecutor → Challenger · Victim → Creator · Rescuer → Coach'
  : '4. What is working well in these empowerment roles and how to sustain them'
}

Write in plain, direct prose. Be specific to this situation. No bullet lists.`;

  const btn = byId('analyze-btn');
  const anEl = byId('analyzing');
  const outEl = byId('analysis-out');
  btn.disabled = true;
  anEl.classList.add('open');
  outEl.classList.remove('open');
  outEl.textContent = '';
  S.analysis = '';

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-allow-browser': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-6',
        max_tokens: 1024,
        stream: true,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    anEl.classList.remove('open');
    outEl.classList.add('open');

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const raw = line.slice(5).trimStart();
        if (raw === '[DONE]') continue;
        try {
          const ev = JSON.parse(raw);
          if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') {
            S.analysis += ev.delta.text;
            outEl.textContent = S.analysis;
            outEl.scrollTop = outEl.scrollHeight;
          }
        } catch (_) {}
      }
    }
  } catch (err) {
    anEl.classList.remove('open');
    outEl.classList.add('open');
    outEl.textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
  }
}

// Restore API key
const k = localStorage.getItem('tri_key');
if (k) byId('apikey').value = k;

// ── PNG Export ────────────────────────────────────────────────────────────────
function exportPNG() {
  const CW = 1440, CH = 900;
  const cv = document.createElement('canvas');
  cv.width = CW; cv.height = CH;
  const ctx = cv.getContext('2d');
  const c = cfg();

  // Background
  ctx.fillStyle = '#fafafa';
  ctx.fillRect(0, 0, CW, CH);

  // ── Left: Triangle ─────────────────────────────────────
  const TL=50, TT=80, TW=620, TH=Math.round(TW*0.9); // 558

  // Vertices (matching SVG proportions: 250/500, 18/450 etc)
  const vT = { x: TL+TW*0.5,  y: TT+TH*0.04  };
  const vR = { x: TL+TW*0.98, y: TT+TH*0.972 };
  const vL = { x: TL+TW*0.02, y: TT+TH*0.972 };

  // Triangle outline
  ctx.beginPath();
  ctx.moveTo(vT.x, vT.y);
  ctx.lineTo(vR.x, vR.y);
  ctx.lineTo(vL.x, vL.y);
  ctx.closePath();
  ctx.strokeStyle = '#c8c8e0';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Vertex labels
  function vertLabel(role, x, y, align) {
    ctx.font = 'bold 13px -apple-system, Helvetica, Arial, sans-serif';
    const tw = ctx.measureText(role.label).width + 22, th = 26;
    let rx = align==='center' ? x-tw/2 : align==='right' ? x-tw-6 : x+6;
    let ry = align==='center' ? y-th-10 : y-th/2;
    rRect(ctx, rx, ry, tw, th, 5, role.bg);
    ctx.fillStyle = role.text;
    ctx.textAlign = 'center';
    ctx.fillText(role.label, rx+tw/2, ry+th/2+4.5);
    ctx.font = '10px -apple-system, Helvetica, Arial, sans-serif';
    ctx.fillStyle = '#aaaacc';
    ctx.fillText(role.desc, rx+tw/2, ry+th+14);
    ctx.textAlign = 'left';
  }
  vertLabel(c.top, vT.x, vT.y, 'center');
  vertLabel(c.br,  vR.x, vR.y, 'right');
  vertLabel(c.bl,  vL.x, vL.y, 'left');

  // Chips
  S.people.forEach(p => {
    const r = c[p.pos];
    const cx = TL + (p.x/100)*TW;
    const cy = TT + (p.y/100)*TH;
    ctx.font = 'bold 12px -apple-system, Helvetica, Arial, sans-serif';
    const pw = Math.min(ctx.measureText(p.name).width+32, 150), ph = 24;
    rRect(ctx, cx-pw/2, cy-ph/2, pw, ph, ph/2, r.bg);
    ctx.fillStyle = r.color;
    ctx.beginPath(); ctx.arc(cx-pw/2+11, cy, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = r.text;
    ctx.textAlign = 'center';
    ctx.fillText(p.name, cx+5, cy+4);
    ctx.textAlign = 'left';
  });

  // Header (above triangle)
  ctx.font = 'bold 24px -apple-system, Helvetica, Arial, sans-serif';
  ctx.fillStyle = '#1a1a2e';
  ctx.fillText(c.title, TL, 50);
  ctx.font = '12px -apple-system, Helvetica, Arial, sans-serif';
  ctx.fillStyle = '#aaa';
  const dateStr = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  ctx.fillText(c.sub + '  ·  ' + dateStr, TL, 67);

  // ── Right: Narrative ───────────────────────────────────
  const RX = TL+TW+48, RW = CW-RX-44;
  let ry = 80;

  function secHead(label) {
    ctx.font = 'bold 9.5px -apple-system, Helvetica, Arial, sans-serif';
    ctx.fillStyle = '#bbbbcc';
    ctx.fillText(label.toUpperCase(), RX, ry);
    ry += 5;
    ctx.strokeStyle = '#e8e8f0'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(RX, ry); ctx.lineTo(RX+RW, ry); ctx.stroke();
    ry += 16;
  }

  const sit = byId('situation').value.trim();
  if (sit) {
    secHead('Situation');
    ctx.font = '13px -apple-system, Helvetica, Arial, sans-serif';
    ctx.fillStyle = '#2a2a3a';
    ry = wrapTxt(ctx, sit, RX, ry, RW, 20);
    ry += 20;
  }

  if (S.people.length) {
    secHead('People & Roles');
    S.people.forEach(p => {
      const r = c[p.pos];
      ctx.font = 'bold 13px -apple-system, Helvetica, Arial, sans-serif';
      ctx.fillStyle = '#1a1a2e';
      ctx.fillText(p.name, RX, ry);
      const nw = ctx.measureText(p.name).width;
      ctx.font = 'bold 9px -apple-system, Helvetica, Arial, sans-serif';
      ctx.fillStyle = r.text;
      const bw = ctx.measureText(r.label).width+14;
      rRect(ctx, RX+nw+8, ry-12, bw, 16, 3, r.bg);
      ctx.fillText(r.label, RX+nw+8+7, ry);
      ry += 18;
      if (p.commentary) {
        ctx.font = '12px -apple-system, Helvetica, Arial, sans-serif';
        ctx.fillStyle = '#666';
        ry = wrapTxt(ctx, p.commentary, RX+10, ry, RW-10, 19);
      }
      ry += 8;
    });
    ry += 8;
  }

  if (S.analysis) {
    secHead('Analysis');
    ctx.font = '12px -apple-system, Helvetica, Arial, sans-serif';
    ctx.fillStyle = '#333';
    ry = wrapTxt(ctx, S.analysis, RX, ry, RW, 19);
  }

  // Footer
  ctx.font = '10px -apple-system, Helvetica, Arial, sans-serif';
  ctx.fillStyle = '#ccc';
  ctx.textAlign = 'right';
  ctx.fillText('Triangle Mapper', CW-44, CH-20);
  ctx.textAlign = 'left';

  cv.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `triangle-${Date.now()}.png`;
    a.click(); URL.revokeObjectURL(url);
  }, 'image/png');
}

function rRect(ctx, x, y, w, h, r, fill) {
  if (fill!==undefined) ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y, x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h, x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h, x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y, x+r,y);
  ctx.closePath(); ctx.fill();
}

function wrapTxt(ctx, text, x, y, maxW, lh) {
  const paras = text.split('\n');
  let cy = y;
  for (const para of paras) {
    if (!para.trim()) { cy += lh*0.5; continue; }
    const words = para.split(' ');
    let line = '';
    for (const w of words) {
      const t = line ? line+' '+w : w;
      if (ctx.measureText(t).width > maxW && line) {
        ctx.fillText(line, x, cy); line = w; cy += lh;
      } else line = t;
    }
    if (line) { ctx.fillText(line, x, cy); cy += lh; }
  }
  return cy;
}

byId('pname').addEventListener('keydown', e => { if (e.key==='Enter') addPerson(); });
renderAll();
